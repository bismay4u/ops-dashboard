<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Dashboard</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css?v=7">
</head>
<body x-data="dashboardApp()" x-init="init()" @keydown.window="onGlobalKeydown($event)">

  <img x-show="watermarkUrl" :src="watermarkUrl" :style="'opacity:' + watermarkOpacity" class="watermark-layer" alt="" aria-hidden="true">

  <template x-if="!authChecked">
    <div class="empty-state" style="padding-top:6rem;">Loading…</div>
  </template>

  <!-- ================= MAIN SHELL — visible to anonymous AND signed-in visitors ================= -->
  <template x-if="authChecked">
    <div>
      <div class="topline"></div>
      <nav class="navbar-glass">
        <div class="navbar-inner">
          <template x-if="logoUrl"><img :src="logoUrl" class="brand-logo" alt="Logo"></template>
          <template x-if="!logoUrl"><div class="brand" x-text="appTitle"></div></template>

          <template x-if="dashboards.length > 1">
            <div class="dash-tabs">
              <template x-for="d in dashboards" :key="d.slug">
                <button class="dash-tab" :class="{active: d.slug === activeSlug}" @click="loadDashboard(d.slug)" x-text="d.name"></button>
              </template>
            </div>
          </template>

          <div class="nav-search" style="position:relative;">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search everything…" @focus="openPalette()" readonly aria-label="Search apps and bookmarks">
            <span class="search-kbd">/</span>
            <template x-if="showSearchHint">
              <div class="search-hint">
                <span>Press <strong>/</strong> anytime to search</span>
                <button @click="dismissSearchHint()" aria-label="Dismiss hint">✕</button>
              </div>
            </template>
          </div>

          <div class="nav-actions" style="position:relative;">
            <button class="icon-btn" @click.stop="themeMenuOpen = !themeMenuOpen" title="Theme" aria-label="Change theme" aria-haspopup="true" :aria-expanded="themeMenuOpen">
              <i class="bi" :class="themeIcon"></i>
            </button>
            <div class="theme-menu" x-show="themeMenuOpen" x-cloak @click.away="themeMenuOpen = false" style="right:0;top:2.7rem;" role="menu">
              <button :class="{active: theme==='light'}" @click="setTheme('light')"><span class="theme-swatch" style="background:#f3f2f7;"></span> Light</button>
              <button :class="{active: theme==='dark'}" @click="setTheme('dark')"><span class="theme-swatch" style="background:#14102b;"></span> Dark</button>
              <button :class="{active: theme==='glass'}" @click="setTheme('glass')"><span class="theme-swatch" style="background:linear-gradient(135deg,#4c2a86,#7c3aed);"></span> Glass</button>
            </div>

            <template x-if="user">
              <div style="position:relative;">
                <button class="user-chip" @click.stop="accountMenuOpen = !accountMenuOpen" aria-haspopup="true" :aria-expanded="accountMenuOpen">
                  <span class="avatar" x-text="user.username.slice(0,1).toUpperCase()"></span>
                  <span x-text="user.username"></span>
                  <i class="bi bi-chevron-down" style="font-size:0.65rem;"></i>
                </button>
                <div class="theme-menu" x-show="accountMenuOpen" x-cloak @click.away="accountMenuOpen = false" style="right:0;top:2.7rem;min-width:210px;" role="menu">
                  <button @click="accountMenuOpen=false; accountModalOpen=true"><i class="bi bi-key"></i> Change password</button>
                  <template x-if="user.roles && user.roles.includes('admin')">
                    <a href="/admin.html" style="display:flex;align-items:center;gap:0.5rem;padding:0.45rem 0.6rem;border-radius:8px;text-decoration:none;color:var(--ink);font-size:0.85rem;"><i class="bi bi-gear"></i> Admin console</a>
                  </template>
                  <button @click="logout()"><i class="bi bi-box-arrow-right"></i> Sign out</button>
                  <button @click="logout(true)"><i class="bi bi-shield-x"></i> Sign out &amp; forget this device</button>
                </div>
              </div>
            </template>
            <template x-if="!user">
              <button class="btn-sm primary" @click="loginModalOpen = true"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
            </template>
          </div>
        </div>
      </nav>

      <div class="shell" :class="{'shell-with-sidebar': quicklinksEnabled}">
        <aside class="quicklinks-sidebar" x-show="quicklinksEnabled">
          <h2>
            <span><i class="bi bi-link-45deg"></i> QuickLinks</span>
            <template x-if="user">
              <button class="icon-btn" @click="openQlModal()" aria-label="Add QuickLink" title="Add QuickLink" style="width:24px;height:24px;"><i class="bi bi-plus-lg" style="font-size:0.7rem;"></i></button>
            </template>
          </h2>

          <template x-if="!user">
            <p style="font-size:0.78rem;color:var(--ink-soft);">Sign in to add your own private links here.</p>
          </template>

          <template x-if="user">
            <div>
              <template x-if="!activeOwnQuickLinks().length && !quickLinks.shared.length">
                <p style="font-size:0.78rem;color:var(--ink-soft);">No QuickLinks yet — add your first private bookmark.</p>
              </template>

              <template x-if="activeOwnQuickLinks().length">
                <div>
                  <div class="quicklink-group-label">My QuickLinks</div>
                  <template x-for="link in activeOwnQuickLinks()" :key="link.id">
                    <div class="quicklink-row">
                      <a :href="link.url" target="_blank" rel="noopener" @click="touchQuickLink(link)" :title="link.description || link.name">
                        <i class="bi bi-link-45deg"></i>
                        <span x-text="link.name"></span>
                      </a>
                      <template x-if="link.status === 'pending_publish'">
                        <span class="pill" title="Publish request pending admin review" style="flex:none;">pending</span>
                      </template>
                      <div class="quicklink-actions">
                        <button @click.stop.prevent="openShareModal(link)" title="Share"><i class="bi bi-share"></i></button>
                        <button @click.stop.prevent="openQlModal(link)" title="Edit"><i class="bi bi-pencil"></i></button>
                        <template x-if="link.status === 'private'">
                          <button @click.stop.prevent="openPublishModal(link)" title="Request publish"><i class="bi bi-megaphone"></i></button>
                        </template>
                        <button @click.stop.prevent="deleteQuickLink(link)" title="Delete"><i class="bi bi-trash"></i></button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="quickLinks.shared.length">
                <div>
                  <div class="quicklink-group-label">Shared with me</div>
                  <template x-for="link in quickLinks.shared" :key="'shared-' + link.id">
                    <div class="quicklink-row">
                      <a :href="link.url" target="_blank" rel="noopener" @click="touchQuickLink(link)" :title="(link.description || link.name) + ' — from ' + link.owner_username">
                        <i class="bi bi-link-45deg"></i>
                        <span x-text="link.name"></span>
                      </a>
                      <span style="font-size:0.65rem;color:var(--ink-soft);flex:none;" x-text="link.owner_username"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </aside>

        <div :class="quicklinksEnabled ? 'shell-main' : 'shell-main-full'">
        <div class="page-header">
          <div class="page-header-title">
            <h1 class="hero-title" x-text="greeting"></h1>
            <span class="eyebrow" x-text="today"></span>
          </div>
          <template x-if="hasCardItems()">
            <div style="display:flex;gap:0.3rem;align-items:center;">
              <span class="eyebrow" style="margin-right:0.3rem;">Sort</span>
              <button class="dash-tab" :class="{active: sortMode==='name'}" @click="sortMode='name'">Name</button>
              <button class="dash-tab" :class="{active: sortMode==='recent'}" @click="sortMode='recent'" :disabled="!user" :title="!user ? 'Sign in to track your last-used apps' : ''">Last used</button>
            </div>
          </template>
        </div>

        <template x-if="!user">
          <p style="font-size:0.85rem;color:var(--ink-soft);margin:-0.4rem 0 0.85rem;">
            You're viewing what's public. <a href="#" @click.prevent="loginModalOpen = true" style="color:var(--accent);">Sign in</a> to see more, pin favorites, and track your recently used apps.
          </p>
        </template>

        <template x-if="loadingDashboard">
          <div class="empty-state">Loading…</div>
        </template>

        <template x-if="!loadingDashboard && activeData">
          <div>
            <!-- Pinned favorites strip -->
            <template x-if="user && pinnedItems().length">
              <div>
                <h2 class="section-heading"><i class="bi bi-star-fill" style="font-size:0.9rem;color:#f5b400;"></i>&nbsp;Pinned</h2>
                <div class="pinned-strip">
                  <template x-for="item in pinnedItems()" :key="'pin-' + item.id">
                    <div class="app-card">
                      <a :href="item.url" target="_blank" rel="noopener" class="app-card-hit" @click="markUsed(item)" :aria-label="'Open ' + item.name"></a>
                      <span class="icon"><i :class="'bi ' + (item.icon || 'bi-link-45deg')"></i></span>
                      <span class="meta">
                        <span class="name" x-text="item.name"></span>
                        <template x-if="item.description">
                          <span class="description" x-text="item.description"></span>
                        </template>
                      </span>
                      <template x-if="item.status_check">
                        <span class="status-dot" :class="statusFor(item.id)"></span>
                      </template>
                      <template x-if="item.has_notes && item.can_view_notes">
                        <button class="favorite-star notes-btn" @click.stop.prevent="openNotes(item)" aria-label="View notes"><i class="bi bi-sticky"></i></button>
                      </template>
                      <button class="favorite-star feedback-btn" @click.stop.prevent="openFeedback(item)" aria-label="Leave feedback"><i class="bi bi-chat-square-text"></i></button>
                      <button class="favorite-star active" @click.stop.prevent="toggleFavorite(item)" aria-label="Remove from favorites"><i class="bi bi-star-fill"></i></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Sections — a dashboard's own set of named, styleable groups (managed
                 from the admin console). Each is rendered as either card-grid or a
                 compact list, per its own display_style. -->
            <template x-for="section in nonEmptySections()" :key="section.id">
              <div>
                <template x-if="section.display_style === 'cards'">
                  <div>
                    <template x-for="cat in section.categories.filter(c => c.items.length)" :key="cat.id">
                      <div>
                        <h2 class="section-heading">
                          <button class="collapse-toggle" :class="{collapsed: isCollapsed(cat.id)}" @click="toggleCategory(cat.id)" :aria-label="isCollapsed(cat.id) ? 'Expand ' + cat.name : 'Collapse ' + cat.name"><i class="bi bi-chevron-down"></i></button>
                          <span x-text="cat.name"></span>
                        </h2>
                        <div class="card-grid" x-show="!isCollapsed(cat.id)">
                          <template x-for="item in sortedItems(cat.items)" :key="item.id">
                            <div class="app-card">
                              <a :href="item.url" target="_blank" rel="noopener" class="app-card-hit" @click="markUsed(item)" :aria-label="'Open ' + item.name"></a>
                              <span class="icon"><i :class="'bi ' + (item.icon || 'bi-link-45deg')"></i></span>
                              <span class="meta">
                                <span class="name" x-text="item.name"></span>
                                <template x-if="item.description">
                                  <span class="description" x-text="item.description"></span>
                                </template>
                                <template x-if="item.last_used_at">
                                  <span style="display:block;font-size:0.68rem;color:var(--ink-soft);font-family:var(--font-mono);" x-text="'Used ' + relativeTime(item.last_used_at)"></span>
                                </template>
                              </span>
                              <template x-if="item.status_check">
                                <span class="status-dot" :class="statusFor(item.id)"></span>
                              </template>
                              <template x-if="item.has_notes && item.can_view_notes">
                                <button class="favorite-star notes-btn" @click.stop.prevent="openNotes(item)" aria-label="View notes"><i class="bi bi-sticky"></i></button>
                              </template>
                              <template x-if="user">
                                <button class="favorite-star feedback-btn" @click.stop.prevent="openFeedback(item)" aria-label="Leave feedback"><i class="bi bi-chat-square-text"></i></button>
                              </template>
                              <template x-if="user">
                                <button class="favorite-star" :class="{active: item.is_favorite}" @click.stop.prevent="toggleFavorite(item)" :aria-label="item.is_favorite ? 'Remove from favorites' : 'Add to favorites'">
                                  <i class="bi" :class="item.is_favorite ? 'bi-star-fill' : 'bi-star'"></i>
                                </button>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="section.display_style === 'list'">
                  <div>
                    <h2 class="section-heading" x-text="section.name"></h2>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 2rem;">
                      <template x-for="cat in section.categories.filter(c => c.items.length)" :key="cat.id">
                        <div>
                          <div class="category-label-row">
                            <button class="collapse-toggle" :class="{collapsed: isCollapsed(cat.id)}" @click="toggleCategory(cat.id)" :aria-label="isCollapsed(cat.id) ? 'Expand ' + cat.name : 'Collapse ' + cat.name"><i class="bi bi-chevron-down"></i></button>
                            <div class="category-label" x-text="cat.name"></div>
                          </div>
                          <div style="display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.5rem;" x-show="!isCollapsed(cat.id)">
                            <template x-for="item in cat.items" :key="item.id">
                              <div class="bookmark-row">
                                <a :href="item.url" target="_blank" rel="noopener" @click="markUsed(item)"
                                   style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--ink);font-size:0.9rem;padding:0.15rem 0;flex:1;min-width:0;">
                                  <i :class="'bi ' + (item.icon || 'bi-link-45deg')" style="color:var(--accent);font-size:0.85rem;"></i>
                                  <span x-text="item.name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
                                </a>
                                <template x-if="item.has_notes && item.can_view_notes">
                                  <button class="favorite-star notes-btn" @click.stop.prevent="openNotes(item)" aria-label="View notes"><i class="bi bi-sticky"></i></button>
                                </template>
                                <template x-if="user">
                                  <button class="favorite-star" @click.stop.prevent="openFeedback(item)" aria-label="Leave feedback"><i class="bi bi-chat-square-text"></i></button>
                                </template>
                                <template x-if="user">
                                  <button class="favorite-star" :class="{active: item.is_favorite}" @click.stop.prevent="toggleFavorite(item)" :aria-label="item.is_favorite ? 'Remove from favorites' : 'Add to favorites'">
                                    <i class="bi" :class="item.is_favorite ? 'bi-star-fill' : 'bi-star'"></i>
                                  </button>
                                </template>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="!hasAnyItems()">
              <div class="empty-state">
                <i class="bi bi-grid" style="font-size:1.5rem;"></i>
                <p style="margin-top:0.5rem;" x-text="user ? 'Nothing here yet. Add apps and bookmarks from the admin console.' : 'Nothing public here yet — sign in if you should have access.'"></p>
              </div>
            </template>
          </div>
        </template>

        <!-- ================= RUNBOOKS PANEL ================= -->
        <template x-if="user && runbooksEnabled">
          <div class="runbooks-panel">
            <h2 class="section-heading" style="display:flex;align-items:center;justify-content:space-between;">
              <span><i class="bi bi-terminal"></i> RunBooks</span>
              <div style="display:flex;gap:0.4rem;">
                <button class="btn-sm" @click="openRbModal(null, false)"><i class="bi bi-plus-lg"></i> New RunBook</button>
                <button class="btn-sm" @click="openRbModal(null, true)"><i class="bi bi-terminal"></i> From Curl</button>
              </div>
            </h2>

            <template x-if="!runbooks.own.length && !runbooks.shared.length && !runbooks.public.length">
              <p style="font-size:0.82rem;color:var(--ink-soft);">No RunBooks yet — save a curl request you run often.</p>
            </template>

            <template x-if="runbooks.own.length">
              <div style="margin-bottom:1.25rem;">
                <div class="quicklink-group-label">My RunBooks</div>
                <div class="card-grid">
                  <template x-for="rb in runbooks.own" :key="rb.id">
                    <div class="app-card runbook-card">
                      <button type="button" class="app-card-hit" @click="openRunModal(rb)" :aria-label="'Run ' + rb.name"></button>
                      <span class="icon"><i class="bi bi-terminal"></i></span>
                      <span class="meta">
                        <span class="name" x-text="rb.name"></span>
                        <template x-if="rb.status === 'pending_publish'"><span class="pill" style="font-size:0.6rem;" title="Publish request pending admin review">pending</span></template>
                        <template x-if="rb.status === 'published'"><span class="pill up" style="font-size:0.6rem;" title="Visible to others per its visibility setting">published</span></template>
                        <template x-if="rb.description"><span class="description" x-text="rb.description"></span></template>
                      </span>
                      <span class="status-dot" :class="{up: rb.last_run && rb.last_run.result === 'success', down: rb.last_run && rb.last_run.result !== 'success'}" :title="rb.last_run ? ('Last run: ' + rb.last_run.result) : 'Never run'"></span>
                      <button class="favorite-star rb-log-btn" @click.stop.prevent="openRunLog(rb)" title="Run log"><i class="bi bi-clock-history"></i></button>
                      <button class="favorite-star rb-share-btn" @click.stop.prevent="openRbShareModal(rb)" title="Share"><i class="bi bi-share"></i></button>
                      <template x-if="rb.status !== 'published'">
                        <button class="favorite-star rb-edit-btn" @click.stop.prevent="openRbModal(rb)" title="Edit"><i class="bi bi-pencil"></i></button>
                      </template>
                      <template x-if="rb.status === 'private'">
                        <button class="favorite-star rb-publish-btn" @click.stop.prevent="openRbPublishModal(rb)" title="Request publish"><i class="bi bi-megaphone"></i></button>
                      </template>
                      <template x-if="rb.status !== 'published'">
                        <button class="favorite-star rb-delete-btn" @click.stop.prevent="deleteRunbook(rb)" title="Delete"><i class="bi bi-trash"></i></button>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <template x-if="runbooks.shared.length">
              <div style="margin-bottom:1.25rem;">
                <div class="quicklink-group-label">Shared with me</div>
                <div class="card-grid">
                  <template x-for="rb in runbooks.shared" :key="'shared-' + rb.id">
                    <div class="app-card runbook-card">
                      <button type="button" class="app-card-hit" @click="openRunModal(rb)" :aria-label="'Run ' + rb.name"></button>
                      <span class="icon"><i class="bi bi-terminal"></i></span>
                      <span class="meta">
                        <span class="name" x-text="rb.name"></span>
                        <span class="description" x-text="'from ' + rb.owner_username"></span>
                      </span>
                      <span class="status-dot" :class="{up: rb.last_run && rb.last_run.result === 'success', down: rb.last_run && rb.last_run.result !== 'success'}" :title="rb.last_run ? ('Last run: ' + rb.last_run.result) : 'Never run'"></span>
                      <button class="favorite-star rb-log-btn" @click.stop.prevent="openRunLog(rb)" title="Run log"><i class="bi bi-clock-history"></i></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <template x-if="runbooks.public.length">
              <div>
                <div class="quicklink-group-label">Available to you</div>
                <div class="card-grid">
                  <template x-for="rb in runbooks.public" :key="'public-' + rb.id">
                    <div class="app-card runbook-card">
                      <button type="button" class="app-card-hit" @click="openRunModal(rb)" :aria-label="'Run ' + rb.name"></button>
                      <span class="icon"><i class="bi bi-terminal"></i></span>
                      <span class="meta">
                        <span class="name" x-text="rb.name"></span>
                        <span class="description" x-text="'by ' + rb.owner_username"></span>
                      </span>
                      <span class="status-dot" :class="{up: rb.last_run && rb.last_run.result === 'success', down: rb.last_run && rb.last_run.result !== 'success'}" :title="rb.last_run ? ('Last run: ' + rb.last_run.result) : 'Never run'"></span>
                      <button class="favorite-star rb-log-btn" @click.stop.prevent="openRunLog(rb)" title="Run log"><i class="bi bi-clock-history"></i></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= LOGIN MODAL ================= -->
  <template x-if="loginModalOpen">
    <div class="modal-backdrop" @click.self="loginModalOpen = false">
      <div class="modal" style="max-width:380px;" role="dialog" aria-modal="true" aria-label="Sign in">
        <h3>Sign in</h3>
        <template x-if="loginError">
          <div style="color:var(--down);font-size:0.85rem;margin-bottom:0.75rem;" x-text="loginError"></div>
        </template>
        <form @submit.prevent="login()">
          <div class="field"><label>Username</label><input type="text" x-model="loginForm.username" autocomplete="username" required></div>
          <div class="field"><label>Password</label><input type="password" x-model="loginForm.password" autocomplete="current-password" required></div>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:var(--ink-soft);margin:0.6rem 0;cursor:pointer;">
            <input type="checkbox" x-model="loginForm.mapIp">
            Remember this device (skip login next time)
          </label>
          <button class="btn-accent" type="submit" :disabled="loginLoading">
            <span x-text="loginLoading ? 'Signing in…' : 'Sign in'"></span>
          </button>
        </form>
        <p style="font-size:0.75rem;color:var(--ink-soft);margin-top:1rem;line-height:1.5;">
          Your IP is <span style="font-family:var(--font-mono)" x-text="clientIp || '—'"></span>.
          <template x-if="loginForm.mapIp">
            <span>Signing in will map this IP to your account, so this device won't need to log in again.</span>
          </template>
          <template x-if="!loginForm.mapIp">
            <span>This device won't be remembered — you'll need to log in again next time.</span>
          </template>
        </p>
      </div>
    </div>
  </template>

  <!-- ================= ACCOUNT / CHANGE PASSWORD MODAL ================= -->
  <template x-if="accountModalOpen">
    <div class="modal-backdrop" @click.self="accountModalOpen = false">
      <div class="modal" style="max-width:380px;" role="dialog" aria-modal="true" aria-label="Change password">
        <h3>Change password</h3>
        <template x-if="accountError">
          <div style="color:var(--down);font-size:0.85rem;margin-bottom:0.75rem;" x-text="accountError"></div>
        </template>
        <form @submit.prevent="changePassword()">
          <div class="field"><label>Current password</label><input type="password" x-model="accountForm.currentPassword" autocomplete="current-password" required></div>
          <div class="field"><label>New password</label><input type="password" x-model="accountForm.newPassword" autocomplete="new-password" minlength="8" required></div>
          <div class="modal-actions" style="justify-content:stretch;">
            <button class="btn-accent" type="submit" :disabled="accountLoading">
              <span x-text="accountLoading ? 'Saving…' : 'Save new password'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= NOTES MODAL ================= -->
  <template x-if="notesModalOpen">
    <div class="modal-backdrop" @click.self="notesModalOpen = false">
      <div class="modal" style="max-width:420px;" role="dialog" aria-modal="true" aria-label="Notes">
        <h3 x-text="notesModalName"></h3>
        <template x-if="notesLoading">
          <div class="empty-state" style="padding:1rem 0;">Loading…</div>
        </template>
        <template x-if="!notesLoading">
          <p style="white-space:pre-wrap;font-family:var(--font-mono);font-size:0.85rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.75rem;" x-text="notesModalText"></p>
        </template>
        <div class="modal-actions">
          <button class="btn-sm" @click="notesModalOpen = false">Close</button>
          <button class="btn-sm primary" :disabled="notesLoading" @click="copyNotes()"><i class="bi bi-clipboard"></i> Copy</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= FEEDBACK MODAL ================= -->
  <template x-if="feedbackModalOpen">
    <div class="modal-backdrop" @click.self="feedbackModalOpen = false">
      <div class="modal" style="max-width:420px;" role="dialog" aria-modal="true" aria-label="Leave feedback">
        <h3 x-text="'Feedback: ' + (feedbackModalItem ? feedbackModalItem.name : '')"></h3>
        <template x-if="feedbackError">
          <div style="color:var(--down);font-size:0.85rem;margin-bottom:0.75rem;" x-text="feedbackError"></div>
        </template>
        <form @submit.prevent="submitFeedback()">
          <div class="field">
            <label>Rating (optional)</label>
            <div style="display:flex;gap:0.25rem;">
              <template x-for="n in [1,2,3,4,5]" :key="n">
                <button type="button" class="favorite-star" style="position:static;opacity:1;font-size:1.1rem;"
                        @click="feedbackForm.rating = (feedbackForm.rating === n ? 0 : n)"
                        :aria-label="'Rate ' + n + ' out of 5'">
                  <i class="bi" :class="feedbackForm.rating >= n ? 'bi-star-fill' : 'bi-star'" :style="feedbackForm.rating >= n ? 'color:#f5b400;' : ''"></i>
                </button>
              </template>
            </div>
          </div>
          <div class="field">
            <label>Your feedback</label>
            <textarea x-model="feedbackForm.message" rows="4" required placeholder="What's working, what's not..."></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-sm" @click="feedbackModalOpen = false">Cancel</button>
            <button class="btn-sm primary" type="submit" :disabled="feedbackLoading">
              <span x-text="feedbackLoading ? 'Sending…' : 'Send feedback'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= QUICKLINK CREATE/EDIT MODAL ================= -->
  <template x-if="qlModalOpen">
    <div class="modal-backdrop" @click.self="qlModalOpen = false">
      <div class="modal" style="max-width:420px;" role="dialog" aria-modal="true" :aria-label="qlEditingId ? 'Edit QuickLink' : 'Add QuickLink'">
        <h3 x-text="qlEditingId ? 'Edit QuickLink' : 'Add QuickLink'"></h3>
        <template x-if="qlError">
          <div style="color:var(--down);font-size:0.85rem;margin-bottom:0.75rem;" x-text="qlError"></div>
        </template>
        <form @submit.prevent="saveQuickLink()">
          <div class="field"><label>Name</label><input type="text" x-model="qlForm.name" required></div>
          <div class="field"><label>URL</label><input type="url" x-model="qlForm.url" placeholder="https://…" required></div>
          <div class="field"><label>Description (optional)</label><textarea x-model="qlForm.description" rows="2"></textarea></div>
          <div class="modal-actions">
            <button type="button" class="btn-sm" @click="qlModalOpen = false">Cancel</button>
            <button class="btn-sm primary" type="submit" :disabled="qlSaving">
              <span x-text="qlSaving ? 'Saving…' : 'Save'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= QUICKLINK SHARE MODAL ================= -->
  <template x-if="qlShareModalOpen">
    <div class="modal-backdrop" @click.self="qlShareModalOpen = false">
      <div class="modal" style="max-width:380px;" role="dialog" aria-modal="true" aria-label="Share QuickLink">
        <h3>Share QuickLink</h3>
        <p class="help-text" style="margin-bottom:0.75rem;">Pick who else can see and open this link.</p>
        <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:0.3rem;">
          <template x-if="!qlAllUsers.length">
            <p style="font-size:0.82rem;color:var(--ink-soft);">No other users exist yet.</p>
          </template>
          <template x-for="u in qlAllUsers" :key="u.id">
            <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;">
              <input type="checkbox" :checked="qlShareUserIds.includes(u.id)" @change="toggleQlShareUser(u.id)">
              <span x-text="u.username"></span>
            </label>
          </template>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-sm" @click="qlShareModalOpen = false">Cancel</button>
          <button class="btn-sm primary" @click="saveShares()">Save sharing</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= QUICKLINK PUBLISH REQUEST MODAL ================= -->
  <template x-if="qlPublishModalOpen">
    <div class="modal-backdrop" @click.self="qlPublishModalOpen = false">
      <div class="modal" style="max-width:420px;" role="dialog" aria-modal="true" aria-label="Request publish">
        <h3>Request to make this generally available</h3>
        <p class="help-text" style="margin-bottom:0.75rem;">
          An admin will review this and, if approved, add it as a normal item under a dashboard section for everyone.
        </p>
        <form @submit.prevent="submitPublishRequest()">
          <div class="field"><label>Remarks for the admin (optional)</label><textarea x-model="qlPublishRemarks" rows="3" placeholder="Why should this be available to everyone?"></textarea></div>
          <div class="modal-actions">
            <button type="button" class="btn-sm" @click="qlPublishModalOpen = false">Cancel</button>
            <button class="btn-sm primary" type="submit">Send request</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= RUNBOOK CREATE/EDIT MODAL ================= -->
  <template x-if="rbModalOpen">
    <div class="modal-backdrop" @click.self="rbModalOpen = false">
      <div class="modal" style="max-width:520px;" role="dialog" aria-modal="true" :aria-label="rbEditingId ? 'Edit RunBook' : 'New RunBook'">
        <h3 x-text="rbEditingId ? 'Edit RunBook' : (rbShowCurlBox ? 'New RunBook from curl' : 'New RunBook')"></h3>

        <template x-if="rbShowCurlBox">
          <div class="field" style="background:var(--surface-hover);border-radius:10px;padding:0.6rem 0.75rem;">
            <label>Paste a curl command</label>
            <textarea x-model="rbCurlInput" x-ref="rbCurlTextarea" rows="3" placeholder="curl -X POST https://api.example.com/x -H 'Authorization: Bearer {{env:TOKEN}}' -d '{...}'" style="font-family:var(--font-mono);font-size:0.78rem;"></textarea>
            <button type="button" class="btn-sm" style="margin-top:0.4rem;" @click="applyCurlParse()"><i class="bi bi-magic"></i> Parse into fields below</button>
            <p class="help-text" style="margin:0.4rem 0 0;font-size:0.72rem;">Reads -X/--request, -H/--header, -d/--data(-raw/-binary). Other flags are ignored.</p>
          </div>
        </template>
        <template x-if="!rbShowCurlBox">
          <button type="button" class="btn-sm" style="margin-bottom:0.9rem;" @click="rbShowCurlBox = true"><i class="bi bi-terminal"></i> Paste from curl instead</button>
        </template>

        <template x-if="rbError">
          <div style="color:var(--down);font-size:0.85rem;margin-bottom:0.75rem;" x-text="rbError"></div>
        </template>
        <form @submit.prevent="saveRunbook()">
          <div class="field"><label>Name</label><input type="text" x-model="rbForm.name" required></div>
          <div class="form-row" style="display:flex;gap:0.6rem;">
            <div class="field" style="flex:0 0 110px;">
              <label>Method</label>
              <select x-model="rbForm.method">
                <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
              </select>
            </div>
            <div class="field" style="flex:1;"><label>URL</label><input type="text" x-model="rbForm.url" placeholder="{{env:BASE_URL}}/path/{{user:id}}" required></div>
          </div>
          <div class="field"><label>Description (optional)</label><input type="text" x-model="rbForm.description"></div>
          <div class="field">
            <label>Headers (one per line, optional)</label>
            <textarea x-model="rbForm.headers" rows="2" placeholder="Authorization: Bearer {{env:API_TOKEN}}" style="font-family:var(--font-mono);font-size:0.8rem;"></textarea>
          </div>
          <div class="field">
            <label>Body (optional)</label>
            <textarea x-model="rbForm.body" rows="2" style="font-family:var(--font-mono);font-size:0.8rem;"></textarea>
          </div>
          <div class="field">
            <label>Variables prompted from whoever runs it (comma-separated names, optional)</label>
            <input type="text" x-model="rbForm.user_variable_names" placeholder="ticket_id, priority">
          </div>
          <p class="help-text" style="margin:-0.3rem 0 0.75rem;">
            Reference values as <code>{{env:NAME}}</code> (set up by an admin) or <code>{{user:NAME}}</code> (declared above,
            asked for on every run) in the URL, headers, or body.
          </p>
          <div class="form-row" style="display:flex;gap:0.6rem;">
            <div class="field" style="flex:1;"><label>Success keyword (optional)</label><input type="text" x-model="rbForm.success_keyword"></div>
            <div class="field" style="flex:1;"><label>Failure keyword (optional)</label><input type="text" x-model="rbForm.failure_keyword"></div>
          </div>
          <p class="help-text" style="margin:-0.3rem 0 0.75rem;">
            No keywords set → judged by HTTP status (2xx/3xx = success). Failure keyword wins if both match.
          </p>
          <div class="field"><label>Notify email on each run (optional)</label><input type="email" x-model="rbForm.notify_email" placeholder="team@example.com"></div>
          <div class="modal-actions">
            <button type="button" class="btn-sm" @click="rbModalOpen = false">Cancel</button>
            <button class="btn-sm primary" type="submit" :disabled="rbSaving">
              <span x-text="rbSaving ? 'Saving…' : 'Save'"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= RUNBOOK RUN MODAL ================= -->
  <template x-if="rbRunModalOpen">
    <div class="modal-backdrop" @click.self="rbRunModalOpen = false">
      <div class="modal" style="max-width:440px;" role="dialog" aria-modal="true" aria-label="Run RunBook">
        <h3 x-text="'Run: ' + (rbRunTarget ? rbRunTarget.name : '')"></h3>
        <template x-for="name in (rbRunTarget ? rbRequiredVars(rbRunTarget) : [])" :key="name">
          <div class="field"><label x-text="name"></label><input type="text" x-model="rbRunVars[name]"></div>
        </template>
        <template x-if="rbRunResult">
          <div style="margin:0.75rem 0;padding:0.75rem;border-radius:8px;background:var(--surface);border:1px solid var(--border);">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;">
              <span class="pill" :class="{up: rbRunResult.result==='success', down: rbRunResult.result!=='success'}" x-text="rbRunResult.result"></span>
              <span style="font-size:0.78rem;color:var(--ink-soft);" x-text="(rbRunResult.http_status || 'no response') + ' · ' + rbRunResult.duration_ms + 'ms'"></span>
            </div>
            <template x-if="rbRunResult.error_message">
              <div style="font-size:0.78rem;color:var(--down);margin-bottom:0.4rem;" x-text="rbRunResult.error_message"></div>
            </template>
            <p style="white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:0.76rem;max-height:180px;overflow-y:auto;margin:0;" x-text="rbRunResult.response_snippet || '(empty response)'"></p>
          </div>
        </template>
        <div class="modal-actions">
          <button type="button" class="btn-sm" @click="rbRunModalOpen = false">Close</button>
          <button class="btn-sm primary" :disabled="rbRunning" @click="executeRun()">
            <span x-text="rbRunning ? 'Running…' : 'Run now'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= RUNBOOK SHARE MODAL ================= -->
  <template x-if="rbShareModalOpen">
    <div class="modal-backdrop" @click.self="rbShareModalOpen = false">
      <div class="modal" style="max-width:380px;" role="dialog" aria-modal="true" aria-label="Share RunBook">
        <h3>Share RunBook</h3>
        <p class="help-text" style="margin-bottom:0.75rem;">Pick who else can see and run this RunBook.</p>
        <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:0.3rem;">
          <template x-if="!rbAllUsers.length">
            <p style="font-size:0.82rem;color:var(--ink-soft);">No other users exist yet.</p>
          </template>
          <template x-for="u in rbAllUsers" :key="u.id">
            <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;">
              <input type="checkbox" :checked="rbShareUserIds.includes(u.id)" @change="toggleRbShareUser(u.id)">
              <span x-text="u.username"></span>
            </label>
          </template>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-sm" @click="rbShareModalOpen = false">Cancel</button>
          <button class="btn-sm primary" @click="saveRbShares()">Save sharing</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= RUNBOOK PUBLISH REQUEST MODAL ================= -->
  <template x-if="rbPublishModalOpen">
    <div class="modal-backdrop" @click.self="rbPublishModalOpen = false">
      <div class="modal" style="max-width:420px;" role="dialog" aria-modal="true" aria-label="Request publish">
        <h3>Request to make this generally available</h3>
        <p class="help-text" style="margin-bottom:0.75rem;">
          An admin will review this and, if approved, this RunBook becomes visible to a wider audience — it stays the
          same RunBook, just with broader visibility.
        </p>
        <form @submit.prevent="submitRbPublishRequest()">
          <div class="field"><label>Remarks for the admin (optional)</label><textarea x-model="rbPublishRemarks" rows="3" placeholder="Why should this be available more broadly?"></textarea></div>
          <div class="modal-actions">
            <button type="button" class="btn-sm" @click="rbPublishModalOpen = false">Cancel</button>
            <button class="btn-sm primary" type="submit">Send request</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ================= RUNBOOK RUN LOG MODAL ================= -->
  <template x-if="rbLogModalOpen">
    <div class="modal-backdrop" @click.self="rbLogModalOpen = false">
      <div class="modal" style="max-width:560px;" role="dialog" aria-modal="true" aria-label="Run log">
        <h3 x-text="'Run log: ' + (rbLogTarget ? rbLogTarget.name : '')"></h3>
        <template x-if="rbLogLoading">
          <div class="empty-state" style="padding:1rem 0;">Loading…</div>
        </template>
        <template x-if="!rbLogLoading && !rbLogRuns.length">
          <div class="empty-state" style="padding:1rem 0;">No runs yet.</div>
        </template>
        <template x-if="!rbLogLoading && rbLogRuns.length">
          <div style="max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem;">
            <template x-for="run in rbLogRuns" :key="run.id">
              <div style="padding:0.6rem 0.75rem;border-radius:8px;background:var(--surface);border:1px solid var(--border);">
                <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                  <span class="pill" :class="{up: run.result==='success', down: run.result!=='success'}" x-text="run.result"></span>
                  <span style="font-size:0.75rem;color:var(--ink-soft);" x-text="(run.http_status || 'no response') + ' · ' + run.duration_ms + 'ms · ' + (run.triggered_by === 'automator' ? 'Automator' : (run.run_by_username || 'unknown'))"></span>
                  <span style="font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-soft);margin-left:auto;" x-text="run.created_at"></span>
                </div>
              </div>
            </template>
          </div>
        </template>
        <div class="modal-actions">
          <button class="btn-sm" @click="rbLogModalOpen = false">Close</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= OMNISEARCH PALETTE ================= -->
  <template x-if="paletteOpen">
    <div class="palette-backdrop" @click.self="closePalette()">
      <div class="palette" @keydown.escape="closePalette()" role="dialog" aria-modal="true" aria-label="Search">
        <input type="text" class="palette-input" placeholder="Search apps and bookmarks…"
               x-model="searchQuery" @input.debounce.150ms="runSearch()" x-ref="paletteInput"
               @keydown.down.prevent="moveActive(1)" @keydown.up.prevent="moveActive(-1)"
               @keydown.enter.prevent="openActive()" aria-label="Search query">
        <div class="palette-results">
          <template x-if="searchQuery && searchResults.length === 0">
            <div style="padding:1rem 1.2rem;color:var(--ink-soft);font-size:0.85rem;">No matches for "<span x-text="searchQuery"></span>"</div>
          </template>
          <template x-for="(r, idx) in searchResults" :key="r.id + '-' + r.dashboard_slug">
            <a :href="r.url" target="_blank" rel="noopener" class="palette-item" :class="{active: idx === activeIdx}" @click="markUsed(r)">
              <i :class="'bi ' + (r.icon || 'bi-link-45deg') + ' icon'"></i>
              <span style="flex:1;min-width:0;">
                <div x-text="r.name"></div>
                <div class="sub" x-text="(r.category_name || 'uncategorized') + ' · ' + r.dashboard_name"></div>
              </span>
            </a>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= TOASTS ================= -->
  <div class="toast-stack" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" :class="t.type">
        <i class="bi" :class="t.type === 'error' ? 'bi-exclamation-circle' : t.type === 'success' ? 'bi-check-circle' : 'bi-info-circle'"></i>
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/js/app.js"></script>
</body>
</html>
